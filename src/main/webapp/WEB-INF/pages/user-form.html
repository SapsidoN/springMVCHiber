<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователь</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f6fa;
        }

        h1 {
            text-align: center;
        }

        form {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000010;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .save-button {
            margin-top: 22px;
            padding: 10px 16px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h1 th:text="${user.id == null ? 'Добавить пользователя' : 'Редактировать пользователя'}">
    Пользователь
</h1>

<form th:object="${user}"
      th:action="${user.id == null ? '/save' : '/update'}"
      method="post">

    <input type="hidden"
           name="id"
           th:value="*{id}"
           th:if="${user.id != null}">

    <label for="name">Имя:</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           required>

    <label for="age">Возраст:</label>
    <input type="number"
           id="age"
           th:field="*{age}"
           min="0"
           required>

    <label for="email">Email:</label>
    <input type="email"
           id="email"
           th:field="*{email}"
           required>

    <button class="save-button" type="submit">
        Сохранить
    </button>
</form>

<a class="back-link" th:href="@{/users}">
    Вернуться к списку
</a>

</body>
</html>
