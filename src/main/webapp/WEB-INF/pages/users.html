<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f6fa;
        }

        h1 {
            text-align: center;
        }

        .add-button {
            display: inline-block;
            padding: 10px 16px;
            margin-bottom: 20px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e9ecef;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button, .edit-button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .edit-button {
            background: #0d6efd;
        }

        .delete-button {
            background: #dc3545;
        }

        .empty {
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>

<h1>Список пользователей</h1>

<a class="add-button" th:href="@{/add}">
    Добавить пользователя
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Возраст</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.email}"></td>
        <td>
            <div class="actions">
                <a class="edit-button"
                   th:href="@{/edit(id=${user.id})}">
                    Изменить
                </a>

                <form th:action="@{/delete}" method="post">
                    <input type="hidden"
                           name="id"
                           th:value="${user.id}">

                    <button class="delete-button" type="submit">
                        Удалить
                    </button>
                </form>
            </div>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="4" class="empty">
            Пользователей пока нет
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
